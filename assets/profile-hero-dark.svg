    <pattern id="mask-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2.4" fill="#fff"/>
    </pattern>
    <mask id="dot-mask">
      <rect width="1200" height="440" fill="url(#mask-dots)"/>
    </mask>
    <linearGradient id="violet" x1="0" x2="1">
